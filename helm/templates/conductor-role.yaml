apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conductor-debeziumservers-creator
rules:
  - apiGroups: ["debezium.io"]
    resources: ["debeziumservers"]
    verbs: ["patch", "create", "delete", "list", "deletecollection"]
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    resourceNames: [ {{ include "debezium-platform.offsetConfigMapName" . | quote }} ]
    verbs: [ "create", "update", "patch", "get" ]
  - apiGroups: [ "apps" ]
    resources: [ "deployments", "replicasets" ]
    verbs: [ "get", "list"]
  - apiGroups: [ "" ]
    resources: [ "pods", "pods/log", "services" ]
    verbs: [ "get", "list" ]
{{- if .Values.pipeline.vault.enabled }}
  # Only when pipelines carry a workload identity: the conductor then owns the ServiceAccount each
  # pipeline pod runs as, because the operator generates one only when the resource names none.
  # Deliberately no rule for roles or rolebindings — creating an empty account grants nothing, while
  # the ability to bind roles to accounts is a short step from granting oneself permissions.
  - apiGroups: [ "" ]
    resources: [ "serviceaccounts" ]
    verbs: [ "create", "update", "patch", "get", "list", "delete", "deletecollection" ]
{{- end }}
