domain:
  url: ""
  name: ""
  # Optional. Overrides the scheme otherwise derived from ingress TLS. Set this
  # when TLS terminates outside the chart's ingress (e.g. an external reverse
  # proxy) and ingress.enabled is false, otherwise the stage UI builds an http://
  # conductor URL and the browser blocks /api calls as mixed content.
  # scheme: https
stage:
  image: quay.io/debezium/platform-stage:nightly
  imagePullPolicy: IfNotPresent
conductor:
  image: quay.io/debezium/platform-conductor:nightly
  imagePullPolicy: IfNotPresent
  offset:
    existingConfigMap: ""
  descriptors:
    official:
      enabled: true
      registry: quay.io
      image: debezium/debezium-descriptors
      tag: nightly
      mountPath: /opt/descriptors
  extraVolumes: [ ]
  extraVolumeMounts: [ ]
  # OIDC bearer-token security (resource-server in service mode). Disabled by
  # default. When enabled, tokens are validated against the issuer's JWKS.
  oidc:
    enabled: false
    # OIDC issuer / realm URL, e.g. https://keycloak.example.com/realms/dmp.
    # Required when enabled.
    authServerUrl: ""
    # Keycloak client id whose roles are read from resource_access.<clientId>.
    # Must match a client in the realm. Realm roles resolve regardless of this
    # value.
    clientId: conductor
    # /api/* policy defaults to "authenticated" when OIDC is enabled;
    # set CONDUCTOR_API_POLICY=permit to open back the API;
    # or a custom role policy
    apiPolicy: authenticated
    # Expected audience (aud) claim. Empty disables audience enforcement; set
    # once the issuer adds this value to tokens (e.g. a Keycloak Audience mapper).
    audience: ""
server:
  image: ""
ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""
offset:
  reusePlatformDatabase: true
  database:
    name: postgres
    host: postgres
    port: 5432
    username: user
    password: password
    auth:
      existingSecret: ""
schemaHistory:
  reusePlatformDatabase: true
  database:
    name: postgres
    host: postgres
    port: 5432
    username: user
    password: password
    auth:
      existingSecret: ""
database:
  enabled: false
  name: postgres
  host: postgres
  auth:
    existingSecret: ""
debezium-operator:
  enabled: true
pipeline:
  labels: {}
  # Give each pipeline pod its own Kubernetes identity so it can fetch its database credentials
  # from a secret backend itself, instead of the password being copied into the DebeziumServer
  # resource and its ConfigMap. Enabling this makes the conductor create one ServiceAccount per
  # pipeline, which is why it also adds a ServiceAccount rule to the conductor's Role.
  vault:
    enabled: false
    # Must match the audience the backend's Kubernetes auth role is bound to.
    audience: openbao
    # The operator mounts this at /debezium/external/<volumeName>.
    volumeName: openbao-token
    tokenExpirationSeconds: 600
    # The name pipelines refer to in ${vault::<name>/password}. Avoid hyphens: the coordinates
    # reach the pod as environment variables, where a hyphen becomes indistinguishable from the
    # property separator.
    name: openbao
    authRole: pipeline
    # Set both to make pipelines resolve their credentials from the store. Left empty, a pipeline
    # still gets its own identity but keeps the credential written into its configuration.
    address: ""
    path: ""
monitoring:
  otel:
    enabled: false
    jmxIntervalMs: 1000
    metricExportIntervalMs: 5000
    collector:
      # The Prometheus exporter is included in the base (otelcol) and contrib distributions,
      # but NOT in the k8s distribution (otelcol-k8s) which is the default when the OTel Operator
      # is installed via Helm. Override the image if your operator defaults to k8s distribution.
      # Example: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.152.0
      image: ""
      replicas: 1
      receivers:
        grpc:
          port: 4317
        http:
          port: 4318
      processors:
        batch:
          timeout: 5s
          sendBatchSize: 512
      exporters:
        prometheus:
          port: 8889
          resourceToTelemetryConversion: true
          constLabels:
            platform: debezium
  panels:
    additionalPanelsPath: ""
    refreshInterval: 30s
  prometheus:
    url: ""
    serviceMonitor:
      enabled: true
      scrapeInterval: 15s
      labels:
        prometheus: kube-prometheus
env: []
